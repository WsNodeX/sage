[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-mcp"
version = "1.0.0"
description = "A zero-dependency framework for building Model Context Protocol servers in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "llm", "agent", "tools", "stdio"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sage = "sage.cli:main"

[tool.setuptools.packages.find]
include = ["sage*"]
